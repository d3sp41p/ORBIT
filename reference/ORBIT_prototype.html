<title>ORBIT Holder System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mission-control HUD over a full-bleed WebGL system; clicking a world opens a wide "mission page" on the right (bottom sheet on phones). Single deliberate dark look. */
:root{
  --void:#000;
  --panel:rgba(4,5,8,.94);
  --line:rgba(255,255,255,.14);
  --line-strong:rgba(255,255,255,.32);
  --ink:#fff;
  --ink-2:#c9ccd3;
  --mute:#8a8f99;
  --signal:#fc3d21;
  --amber:#f2b33d;
  --good:#5fd39a;
  --f-sans:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pw:min(660px,50vw);
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important}
body{background:var(--void);color:var(--ink);font-family:var(--f-sans);overflow:hidden;margin:0;-webkit-font-smoothing:antialiased}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#gl.hover{cursor:pointer}
#ov{pointer-events:none;z-index:2}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud > *{pointer-events:auto}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:28px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.brand span{display:flex;flex-direction:column;line-height:1.05}
.brand b{font:800 15px var(--f-sans);letter-spacing:.14em}
.brand small{white-space:nowrap;font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tele{display:flex;gap:0;margin:0}
.tele div{display:flex;flex-direction:column;gap:3px;padding:0 16px;border-left:1px solid var(--line)}
.tele dt{font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tele dd{margin:0;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.top .spacer{flex:1}
.btn{font:600 11px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--line-strong);border-radius:2px;padding:10px 14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:focus-visible,input:focus-visible,.copy:focus-visible,.gfeed button:focus-visible,.back:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.demo{white-space:nowrap;font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(242,179,61,.5);padding:4px 7px}

/* hero */
.hero{top:calc(env(safe-area-inset-top,0px) + 92px);left:22px;width:380px;display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
.hero h1{font:800 40px/1.02 var(--f-sans);margin:0;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.8)}
.hero .sub{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6;max-width:40ch;text-shadow:0 1px 14px rgba(0,0,0,.9)}
.search{display:flex;align-items:stretch;border:1px solid var(--line-strong);background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:400 12.5px var(--f-mono);padding:12px 12px}
.search input::placeholder{color:#6d727c}
.search .btn{border:0;border-left:1px solid var(--line-strong)}
.search-help{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--mute);min-height:18px;flex-wrap:wrap}
.search-help button{background:none;border:0;color:var(--ink);font:600 10.5px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:0;border-bottom:1px solid var(--line-strong);padding-bottom:2px}
.search-help button:hover{border-color:var(--ink)}
.search-help .err{color:var(--signal);text-transform:none;letter-spacing:0}

/* mission news */
.gfeed{left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:380px;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line-strong);background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,.35))}
.gfeed h3,.legend h3{margin:0;padding:10px 0 8px;font:500 10px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.live{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.gfeed ul{list-style:none;margin:0;padding:0}
.gfeed li{border-top:1px solid var(--line);animation:slide .5s ease-out}
@keyframes slide{from{opacity:.2}}
.gfeed li button{all:unset;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:3px;padding:9px 2px;cursor:pointer}
.gfeed li button:hover .hl{text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;gap:10px;align-items:center}
.meta time{font:400 10px var(--f-mono);color:var(--mute);letter-spacing:.04em}
.tag{font:600 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.t-bad{color:var(--signal)}.t-mile{color:var(--ink)}.t-rare{color:var(--amber)}.t-good{color:var(--good)}
.gfeed .hl{font:600 13px/1.35 var(--f-sans);color:var(--ink)}
.gfeed .pl{font:400 10.5px var(--f-mono);color:var(--mute);letter-spacing:.04em}

/* legend + zoom */
.key{right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.legend{border-top:1px solid var(--line-strong);width:250px;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,.25))}
.legend .rule{font-size:12px;color:var(--ink-2);line-height:1.5;margin-bottom:8px}
.legend .rule b{color:var(--ink);font-weight:600}
.legend table{border-collapse:collapse;font-size:11.5px;width:100%}
.legend td{padding:5px 0;border-top:1px solid var(--line)}
.legend td:last-child{text-align:right;font-family:var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.zoom{display:flex;gap:0;border:1px solid var(--line-strong);background:rgba(0,0,0,.6)}
.icon-btn{width:38px;height:38px;background:transparent;border:0;border-left:1px solid var(--line);color:var(--ink);font:400 17px var(--f-mono);cursor:pointer;display:grid;place-items:center}
.icon-btn:first-child{border-left:0}
.icon-btn:hover{background:rgba(255,255,255,.08)}

#tip{position:fixed;z-index:6;pointer-events:none;background:#000;border:1px solid var(--line-strong);padding:7px 10px;font:600 12px var(--f-sans);white-space:nowrap;transform:translate(14px,14px)}
#tip small{display:block;color:var(--mute);font:400 10px var(--f-mono);letter-spacing:.06em;margin-top:2px;text-transform:uppercase}

/* mission page */
#panel{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 69px);right:0;bottom:0;width:var(--pw);background:var(--panel);border-left:1px solid var(--line-strong);display:flex;flex-direction:column;animation:panelin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes panelin{from{transform:translateX(40px);opacity:0}}
.p-scroll{overflow-y:auto;padding:18px 40px calc(env(safe-area-inset-bottom,0px) + 48px)}
.back{all:unset;cursor:pointer;font:600 10.5px var(--f-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.back:hover{color:var(--ink)}
.m-head{display:flex;flex-direction:column;gap:12px;padding:22px 0 26px;border-bottom:1px solid var(--line-strong)}
.crumbs{font:500 10px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.m-head h2{margin:0;font:800 clamp(34px,4.2vw,52px)/1 var(--f-sans);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.status .live{margin-right:2px}
.status .sep{color:var(--mute)}
.lede{margin:0;font-size:17px;line-height:1.55;color:var(--ink-2);max-width:56ch}
.addr{display:flex;gap:10px;align-items:center;font:400 11px var(--f-mono);color:var(--mute);min-width:0}
.addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy{background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:2px;font:600 9.5px var(--f-sans);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;cursor:pointer;flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sec{padding:26px 0;border-bottom:1px solid var(--line)}
.sec > h3{margin:0 0 16px;font:500 10.5px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.sec > h3 span{letter-spacing:.04em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0;border-top:1px solid var(--line)}
.fact{padding:14px 14px 14px 0;border-bottom:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:4px}
.fact dt{font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.fact dd{margin:0;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.fact dd b{font:600 24px/1.1 var(--f-sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fact dd span{font:400 12px var(--f-mono);color:var(--mute)}
.fact small{font:400 10.5px var(--f-mono);color:var(--mute)}
.fact svg{display:block;width:100%;max-width:150px;height:20px;margin-top:4px}
.stab{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.stab-row{display:flex;justify-content:space-between;font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.stab-row b{color:var(--ink);font-weight:500}
.bar{height:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%}
.stab p{margin:0;font-size:12px;color:var(--mute)}
ol.press{list-style:none;margin:0;padding:0}
ol.press li{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
ol.press li:first-child{border-top:0;padding-top:0}
ol.press h4{margin:0;font:700 17px/1.3 var(--f-sans);text-wrap:balance}
ol.press p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.more{background:none;border:0;color:var(--ink);font:600 10.5px var(--f-sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0 0 2px;border-bottom:1px solid var(--line-strong);margin-top:6px}
.report{border:1px solid var(--line-strong);padding:20px 22px;display:flex;flex-direction:column;gap:12px;margin:26px 0;background:rgba(255,255,255,.02)}
.report h3{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
.report p{margin:0;font-size:15px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap}
.report .hint{font-size:12.5px;color:var(--mute);line-height:1.5}
ol.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:1px solid var(--line-strong)}
ol.tl li{position:relative;padding:0 0 16px;display:flex;flex-direction:column;gap:3px}
ol.tl li::before{content:"";position:absolute;left:-20px;top:4px;width:7px;height:7px;background:#000;border:1px solid var(--ink-2);border-radius:50%}
ol.tl li.t-bad::before{border-color:var(--signal);background:var(--signal)}
ol.tl li.t-rare::before{border-color:var(--amber);background:var(--amber)}
ol.tl li.t-mile::before{background:var(--ink)}
ol.tl time{font:400 10px var(--f-mono);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
ol.tl span{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,auto) 1fr;border-top:1px solid var(--line)}
dl.kv dt,dl.kv dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0;min-width:0}
dl.kv dt{font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding-top:13px}
dl.kv dd{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
dl.kv dd.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.badge{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.badge b{font:600 13px var(--f-sans)}
.badge small{color:var(--mute);font-size:11.5px}
.badge.off{opacity:.35}
.badge.on b::before{content:"■ ";color:var(--signal);font-size:9px;vertical-align:2px}
.badge.rare b::before{content:"◆ ";color:var(--amber);font-size:10px}
.empty{font-size:13px;color:var(--mute);line-height:1.55;margin:0}
.edit{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line-strong);padding:18px;margin-top:6px}
.edit h4{margin:0;font:500 10.5px var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
.edit label{display:flex;flex-direction:column;gap:6px;font:500 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.edit input{background:#000;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink);font:500 14px var(--f-sans);letter-spacing:0;text-transform:none;padding:10px 11px;min-width:0}
.edit input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.edit .note{font-size:12px;color:var(--mute);line-height:1.5;margin:0}
.edit .err{font-size:12.5px;color:var(--signal);margin:0}
.edit .row{display:flex;gap:8px;flex-wrap:wrap}
.btn.ghost{border-color:transparent}

#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#000;transition:opacity .9s}
#loading .ld{display:flex;flex-direction:column;align-items:center;gap:10px;font:500 10.5px var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
#loading .ld b{font:800 15px var(--f-sans);letter-spacing:.2em;color:var(--ink)}
#loading .ld i{display:block;width:120px;height:1px;background:var(--line);position:relative;overflow:hidden}
#loading .ld i::after{content:"";position:absolute;inset:0;width:40%;background:var(--signal);animation:scan 1.2s infinite linear}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#loading.gone{opacity:0;pointer-events:none}
#loading.err .ld{color:var(--signal);text-transform:none;letter-spacing:0;padding:0 24px;text-align:center;font-size:13px}

@media (min-width:761px){body.panel-open .hero,body.panel-open .gfeed,body.panel-open .key{display:none}}
@media (max-width:1100px){.tele div:nth-child(2),.tele div:nth-child(3){display:none}}
@media (max-width:760px){
  .top{gap:12px;padding:10px 14px}
  .tele{display:none}
  .top .btn{padding:9px 10px;letter-spacing:.08em}
  .top .btn:not(.primary):not(#langBtn),.demo{display:none}
  .brand small{display:none}
  .hero{left:16px;right:16px;width:auto;top:calc(env(safe-area-inset-top,0px) + 74px)}
  .hero h1{font-size:28px}
  .hero .sub,.legend{display:none}
  .gfeed{left:16px;right:72px;width:auto}
  .gfeed li:nth-child(n+3){display:none}
  .key{right:16px}
  .zoom{flex-direction:column}
  .icon-btn{border-left:0;border-top:1px solid var(--line)}
  .icon-btn:first-child{border-top:0}
  #panel{top:42%;left:0;width:auto;border-left:0;border-top:1px solid var(--line-strong);animation-name:sheetin}
  @keyframes sheetin{from{transform:translateY(40px);opacity:0}}
  .p-scroll{padding:16px 18px 40px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .badges{grid-template-columns:1fr}
  body.panel-open .hero,body.panel-open .gfeed,body.panel-open .key{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<canvas id="gl" aria-label="3D star system where each planet is a token holder"></canvas>
<canvas id="ov"></canvas>
<div id="loading"><div class="ld"><b>ORBIT DSN</b><i></i><span id="ldText">Establishing link…</span></div></div>

<header class="hud top">
  <a class="brand" href="#" id="brandLink"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.2"/><ellipse cx="16" cy="16" rx="14" ry="5.2" transform="rotate(-24 16 16)" fill="none" stroke="#fc3d21" stroke-width="1.4"/><circle cx="16" cy="16" r="3.2" fill="currentColor"/><circle cx="27.4" cy="11.2" r="1.7" fill="#fc3d21"/></svg><span><b id="brandName">ORBIT</b><small data-i18n="agency">Deep Space Network</small></span></a>
  <dl class="tele">
    <div><dt>UTC</dt><dd id="tUtc">--:--:--</dd></div>
    <div><dt data-i18n="tMet">Mission time</dt><dd id="tMet">T+0d</dd></div>
    <div><dt data-i18n="objectsL">Objects</dt><dd id="sHolders">0</dd></div>
    <div><dt data-i18n="starL">Star</dt><dd id="sClass">G</dd></div>
    <div><dt data-i18n="mcapL">Market cap</dt><dd id="sMcap">$0</dd></div>
  </dl>
  <div class="spacer"></div>
  <span class="demo" data-i18n="demo">Demo data</span>
  <button class="btn" id="langBtn" type="button">EN</button>
  <a class="btn" id="xLink" href="#" target="_blank" rel="noopener">X</a>
  <a class="btn primary" id="buyLink" href="#" target="_blank" rel="noopener">Buy $ORBIT</a>
</header>

<section class="hud hero" id="hero">
  <p class="eyebrow" data-i18n="program">Holder Exploration Program</p>
  <h1 data-i18n-html="h1">Every holder is a world.</h1>
  <p class="sub" data-i18n="heroP"></p>
  <form class="search" id="searchForm" autocomplete="off">
    <input id="search" type="text" data-i18n-ph="searchPh" aria-label="Wallet address or planet name" spellcheck="false">
    <button class="btn" type="submit" data-i18n="find">Find</button>
  </form>
  <div class="search-help" id="searchHelp"></div>
</section>

<section class="hud gfeed" aria-live="polite">
  <h3><span class="live"></span><span data-i18n="gfeedH">Mission news</span></h3>
  <ul id="gfeed"></ul>
</section>

<section class="hud key">
  <div class="legend">
    <h3 data-i18n="legendH">How the system works</h3>
    <div class="rule" data-i18n-html="legendRule"></div>
    <table>
      <tr><td data-i18n="lg1"></td><td>#1</td></tr>
      <tr><td data-i18n="lg2"></td><td>#2–10</td></tr>
      <tr><td data-i18n="lg3"></td><td>#11–50</td></tr>
      <tr><td data-i18n="lg4"></td><td>#51–200</td></tr>
      <tr><td data-i18n="lg5"></td><td>#201+</td></tr>
    </table>
  </div>
  <div class="zoom">
    <button class="icon-btn" id="zIn" aria-label="Zoom in">+</button>
    <button class="icon-btn" id="zOut" aria-label="Zoom out">−</button>
    <button class="icon-btn" id="zFit" aria-label="Show whole system">◎</button>
  </div>
</section>

<div id="tip" hidden></div>
<aside id="panel" hidden aria-label="Mission page">
  <div class="p-scroll" id="pBody"></div>
</aside>

<script type="importmap">

</script>
<script>
window.__LANG=(()=>{try{return localStorage.getItem("orbit-lang")||"ru";}catch(_){return "ru";}})();

function applySell(S,h,day,s){

  S.pop*=1-k;S.bio*=1-k*.6;S.tech=Math.max(0,S.tech-k*2.2);S.stab=Math.max(0,S.stab-k*60);S.ash=Math.min(1,S.ash+k*1.5);S.dim=Math.min(1,S.dim+k*1.5);

  ev(S,day,"sell",{c,f:Math.round(f*100),a:Math.round(k*(S.civ?100:60)),civ:S.civ,tech:S.tech.toFixed(2)});
  if(S.civ&&S.pop<20000){S.civ=false;S.tech=0;ev(S,day,"collapse",{species:S.bible.species});}

function step(S,h,day){
  const r=S.r,rock=h.cls==="rocky",ast=h.cls==="asteroid";
  while(S.sellIdx<h.sells.length&&h.sells[S.sellIdx].at<=day){applySell(S,h,day,h.sells[S.sellIdx]);S.sellIdx++;}
  const stabTarget=26+66*(1-Math.exp(-day/22))*(.85+.15*(h.sizeBonus-1));
  S.stab+=(stabTarget-S.stab)*.035;
  const wasHot=S.temp>300;
  const target=S.targetT+S.tOff+(S.atm-.5)*12;
  S.temp+=(target-S.temp)*(S.temp>200?.3:.08);
  S.tOff*=.975;S.ash*=.96;S.dim*=.93;
  if(wasHot&&S.temp<=300&&rock)ev(S,day,"cooled",{temp:S.temp});
  if(rock&&S.temp<100)S.water=Math.min(S.waterMax,S.water+.006*(.4+r()));
  if(rock)S.atm+=(S.atmMax-S.atm)*.012;
  // life
  if(!S.life){const pd=lifeChanceDay(S,h)*(1+(S.soupBoost||0));if(pd>0&&r()<pd*TICK){S.life=true;S.lifeDay=day;S.bio=.04;ev(S,day,rock?"life":ast?"lifeAst":"lifeGas",{place:pickI(r,W.places.length),n:Math.max(1,Math.round(day))});}}

    if(!S.bible){const ct=pickI(r,W.ctypes.length);S.bible={species:(()=>{const n=nameGen(r,2,2);return{ru:n.ru+"иды",en:n.en+"ids"};})(),ct,look:ct,capital:nameGen(r),ideo:pickI(r,W.ideology.length),motto:pickI(r,W.motto.length)};}
    S.cities=[S.bible.capital,nameGen(r),nameGen(r)];
    applyCustom(h);ev(S,day,"civ",{species:S.bible.species,city:S.bible.capital,ct:S.bible.ct,pop:S.pop});}}
  if(S.civ){const capP=Math.pow(h.size,2)*1.4e9*(.3+S.bio)*(1+S.tech*.7);S.pop+=S.pop*.035*(1-S.pop/capP);S.tech+=.004*h.sizeBonus*(S.stab/70)*CONFIG.speed/(1+S.tech*.35);}

varying vec3 vL;varying vec3 vW;
void main(){
  float r=length(vL.xy);float t=(r-uIn)/(uOut-uIn);
  if(t<0.0||t>1.0)discard;
  float b=0.55+0.25*sin(t*90.0+uSeedF)+0.2*sin(t*31.0+uSeedF*2.0)+0.15*sin(t*230.0);
  float gap=smoothstep(0.015,0.0,abs(t-0.62))+smoothstep(0.008,0.0,abs(t-0.31))*0.7;
  float edge=smoothstep(0.0,0.06,t)*smoothstep(1.0,0.9,t);
  float a=clamp(b,0.0,1.0)*edge*(1.0-gap)*0.85;
  vec3 L=normalize(-vW);vec3 toC=uCenter-vW;float tc=dot(toC,L);vec3 cl=vW+L*tc-uCenter;

const STAR_FS=`
uniform float uTime;uniform vec3 uCore;uniform vec3 uEdge;
varying vec3 vObj;varying vec3 vN;varying vec3 vW;
${NOISE}
void main(){
  vec3 p=normalize(vObj);vec3 N=normalize(vN);vec3 V=normalize(cameraPosition-vW);
  float n=fbm(p*3.5+vec3(0.0,uTime*0.03,uTime*0.02),5);
  float g=fbm(p*16.0-vec3(uTime*0.08),3);
  float k=clamp(0.55+n*0.9+g*0.35,0.0,1.0);
  vec3 c=mix(uEdge,uCore,k);
  float mu=max(dot(N,V),0.0);
  float limb=pow(mu,0.5);
  vec3 lin=pow(c,vec3(2.2))*(0.6+2.6*limb)*2.2;

}`;

/* ================= sky: procedural Milky Way baked once into a cube map ================= */
const SKY_VS=`varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const SKY_FS=`
varying vec3 vD;
uniform vec3 uGN;uniform vec3 uGC;
${NOISE}
float h1(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
vec3 starCell(vec3 p,float dens,float rad,float gain){
  vec3 i=floor(p),f=fract(p);
  vec3 h=hash3(i);
  if(h.x>dens)return vec3(0.0);
  vec3 c=h.yzx*0.7+0.15;float d=length(f-c);
  float m=pow(h1(i+3.1),5.0);
  float s=exp(-d*d/(rad*rad))*(0.18+m*gain);
  float tmp=h1(i+7.7);
  vec3 col=tmp<0.15?vec3(1.0,0.62,0.42):tmp<0.4?vec3(1.0,0.86,0.68):tmp<0.8?vec3(0.95,0.96,1.0):vec3(0.66,0.78,1.0);
  return col*s;
}
void main(){
  vec3 d=normalize(vD);
  float sb=dot(d,uGN);float b=asin(clamp(sb,-1.0,1.0));
  vec3 inPlane=normalize(d-uGN*sb);
  float la=acos(clamp(dot(inPlane,uGC),-1.0,1.0));
  float warp=fbm(d*2.0+4.0,3)*0.07;
  float bw=b+warp;
  float band=exp(-pow(bw/0.15,2.0));
  float wide=exp(-pow(bw/0.42,2.0));
  float bulge=exp(-pow(la/0.62,2.0))*exp(-pow(bw/0.24,2.0));
  float along=0.55+0.45*exp(-pow(la/1.4,2.0));
  float n1=fbm(d*3.2+1.0,6)*0.5+0.5;
  float n2=fbm(d*11.0+5.0,5)*0.5+0.5;
  float glow=(band*(0.3+0.7*n1)*along+wide*0.12*n1+bulge*1.1*(0.55+0.45*n2));
  float dn=fbm(d*4.5+11.0,6);
  float dust=smoothstep(-0.02,0.3,dn)*exp(-pow((bw-0.012)/0.055,2.0));
  float dn2=fbm(d*13.0+3.0,5);
  float dust2=smoothstep(0.05,0.45,dn2)*exp(-pow(bw/0.11,2.0));
  glow*=1.0-clamp(dust*0.92+dust2*0.55,0.0,0.96);
  vec3 bandCol=mix(vec3(0.5,0.58,0.78),vec3(1.0,0.84,0.62),clamp(bulge*1.6,0.0,1.0));
  vec3 col=bandCol*glow*0.2;
  float neb=smoothstep(0.62,0.9,fbm(d*5.0+20.0,5)*0.5+0.5)*band;
  col+=vec3(0.7,0.16,0.28)*neb*0.09;
  float neb2=smoothstep(0.6,0.92,fbm(d*2.2+40.0,5)*0.5+0.5)*(0.3+wide);
  col+=vec3(0.12,0.22,0.5)*neb2*0.03;
  col+=vec3(0.0025,0.003,0.006);
  float sd=0.04+0.5*band+0.25*bulge;
  col+=starCell(d*140.0,sd,0.18,0.6)*(0.3+0.7*band)*0.6;
  col+=starCell(d*260.0+17.0,0.10+0.6*band,0.17,0.2)*0.35;
  gl_FragColor=vec4(col,1.0);
}`;

controls.addEventListener("start",()=>{if(fly.active)fly.active=false;});
function flyTo(targetFn,dist,dur=1.8){
  const from=camera.position.clone(),fromT=controls.target.clone();
  const dir=from.clone().sub(fromT).normalize();if(dir.y<.15){dir.y=.25;dir.normalize();}
  Object.assign(fly,{active:true,t:0,dur,from,fromT,targetFn,dist,dir,overview:false,follow:null});follow=null;
}
let newsShown=8,editing=false,editErr="";
function focus(h,close=false){
  if(selected!==h){newsShown=8;editing=false;aiState={h:null,text:"",busy:false,err:""};}
  setSelected(h);starPanel=false;renderPanel(true);
  controls.minDistance=h.size*1.6;
  const k=innerWidth<760?1.8:1;flyTo(()=>h.pos,h.size*(close?2.8:7)*k,close?1.2:1.9);fly.follow=h;
}
function openStar(){setSelected(null);starPanel=true;renderPanel(true);controls.minDistance=STAR_R*1.5;flyTo(()=>star.position,STAR_R*7,1.6);fly.follow=null;}
function overview(){closePanel();controls.minDistance=8;flyTo(()=>new THREE.Vector3(),1,2.2);fly.overview=true;}
document.getElementById("zIn").onclick=()=>{fly.active=false;const d=camera.position.clone().sub(controls.target);camera.position.copy(controls.target).add(d.multiplyScalar(.65));};
document.getElementById("zOut").onclick=()=>{fly.active=false;const d=camera.position.clone().sub(controls.target);if(d.length()<2200)camera.position.copy(controls.target).add(d.multiplyScalar(1.5));};

function spark(vals,color){if(vals.length<2)return"";const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(20-(v-mn)/rg*17).toFixed(1)}`).join(" ");const lx=100,ly=(20-(vals.at(-1)-mn)/rg*17).toFixed(1);return`<svg viewBox="0 0 104 22" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2" fill="${color}"/></svg>`;}
function agoText(h,day){const ms=NOW+(performance.now()-T0)-(h.start+day*DAY);const hrs=Math.floor(ms/3600000);if(hrs<1)return t("ago").now;if(hrs<48)return t("ago").h(hrs);return t("ago").d(Math.floor(hrs/24));}

function stamp(h,day){const d=new Date(h.start+day*DAY);return d.toLocaleDateString(t("locale"),{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})+" · "+d.toISOString().slice(11,16)+" UTC";}

/* ================= AI chronicler (Claude via the page's sample capability) ================= */
let sampleFn;
(async()=>{try{sampleFn=window.claude?await window.claude.use("sample"):null;}catch(_){sampleFn=null;}if(sampleFn===null&&!panel.hidden&&!starPanel)renderPanel();})();
function chroniclePrompt(h){
  const S=h.S,B=S.bible,lang=LANG==="ru"?"Russian":"English";
  const facts=[`Planet: ${h.name} (${I18N.en.cls[h.cls]}, rank #${h.rank} among holders, held for ${Math.floor(h.days)} days)`,`Era: ${I18N.en.eras[S.era]}`,`Temperature: ${Math.round(S.temp)} °C`,h.cls==="rocky"?`Water: ${Math.round(S.water*100)}% of surface; atmosphere ${S.atm.toFixed(2)} atm`:"",S.life?`Life since day ${Math.round(S.lifeDay)}`:`No life yet; chance ${(lifeChanceDay(S,h)*100).toFixed(1)}% per day`,S.civ?`Civilization: population ${Math.round(S.pop)}, technology ${S.tech.toFixed(2)}, stability ${Math.round(S.stab)}/100`:"",B?`Species: ${B.species.en}; type ${W.ctypes[B.ct][1]}; look: ${W.looks[B.look][1]}; capital ${B.capital.en}; beliefs: ${W.ideology[B.ideo][1]}; motto: "${B.mottoCustom||W.motto[B.motto][1]}"`:"",S.finds.length?`Rare finds: ${S.finds.map(f=>W.finds[f.f][1]).join(", ")}`:""].filter(Boolean).join("\n");
  const last=[...S.news].slice(-14).map(e=>`Day ${Math.floor(e.day)}: ${newsText(e,h)}`).join("\n");
  return `You are the chronicler of a fictional planet in a playful sci-fi crypto game. Write the planet's chronicle in ${lang}: 3 short paragraphs, 130-180 words in total. Tone: grounded science fiction with light humour, vivid but concise. Rules: use only the facts and events below and keep every number exactly as given; you may invent small colourful details (names of places, customs, sounds) that do not contradict the facts; do not mention money, prices, buying or selling advice; the "holder" is the planet's owner in the game. Plain text only, no headings, no lists.\n\nFACTS\n${facts}\n\nRECENT EVENTS (oldest first)\n${last}`;
}
async function runChronicle(h){
  if(!sampleFn){aiState={h,text:"",busy:false,err:t("aiNo")};renderPanel();return;}
  aiState={h,text:"",busy:true,err:""};renderPanel();
  try{
    const res=await sampleFn(chroniclePrompt(h),{modelTier:"quick",cache:false,onText:({text})=>{if(aiState.h===h){aiState.text=text;const el=document.getElementById("aiText");if(el&&selected===h){el.hidden=false;el.textContent=text;}}}});
    if(aiState.h===h){aiState.text=res.text;aiState.busy=false;}
  }catch(e){if(aiState.h===h){aiState.busy=false;aiState.err=e&&e.code==="not_granted"?t("aiNo"):(e&&e.text)||t("aiErr");if(e&&e.text)aiState.text=e.text;}}
  if(selected===h)renderPanel();
}

/* ================= global feed + live ticks ================= */
const gfeedEl=document.getElementById("gfeed");
let gitems=[];
function gWorthy(h,e){const k=KIND[e.k];if(k==="neutral")return e.k==="election"||e.k==="neighbor";if(h.cls==="asteroid")return k==="mile"||k==="rare";return true;}
function gfeedRender(){gfeedEl.innerHTML=gitems.slice(0,4).map((g,i)=>{const k=KIND[g.e.k];const[hd]=splitNews(newsText(g.e,g.h));return`<li><button data-i="${i}"><span class="meta"><span class="tag t-${k}">${t(TAG[k])}</span><time>${agoText(g.h,g.e.day)}</time></span><span class="hl">${esc(hd)}</span><span class="pl">${esc(g.h.name)} · #${g.h.rank} · ${t("cls")[g.h.cls]}</span></button></li>`;}).join("");gfeedEl.querySelectorAll("button").forEach(b=>b.onclick=()=>focus(gitems[+b.dataset.i].h));}
{
  const cut=NOW-30*3600000;
  for(const h of holders)for(const e of h.S.news){const at=h.start+e.day*DAY;if(at>=cut&&gWorthy(h,e))gitems.push({h,e,at});}
  gitems.sort((a,b)=>b.at-a.at);gitems=gitems.slice(0,12);
}
setInterval(()=>{
  const now=NOW+(performance.now()-T0);let changed=false;
  for(const h of holders){const S=h.S;const due=h.start+S.k*TICK*DAY;if(now>=due){const before=S.news.length;step(S,h,S.k*TICK);S.k++;h.days=(now-h.start)/DAY;syncVisual(h);
    for(let i=before;i<S.news.length;i++){const e=S.news[i];if(!gWorthy(h,e))continue;gitems.unshift({h,e,at:h.start+e.day*DAY});changed=true;}
    if(selected===h&&!starPanel&&S.news.length>before)renderPanel();}}
  if(changed){gitems=gitems.slice(0,12);gfeedRender();}
},1000);
setInterval(()=>{if(gitems.length)gfeedRender();},60000);

document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault();

  if(!h&&q.length>=4)h=holders.find(x=>x.addr.toLowerCase().includes(ql)||x.name.toLowerCase().includes(ql));

function applyLang(){

/* ================= loop ================= */
const clock=new THREE.Clock();let T=0;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const intro={t:0,from:camera.position.clone(),to:new THREE.Vector3(0,270,620)};
let introDone=false,frames=0;
function animate(){
  const dt=Math.min(clock.getDelta(),.05);T+=dt;const sp=reduce?.3:1;
  starMat.uniforms.uTime.value=T;window.__nearStars.uniforms.uTime.value=T;
  const pos=dotGeo.attributes.position.array;
  holders.forEach((h,i)=>{h.ang+=h.speed*dt*sp;h.pos.set(Math.cos(h.ang)*h.orbit,0,Math.sin(h.ang)*h.orbit).applyQuaternion(h.q);pos[i*3]=h.pos.x;pos[i*3+1]=h.pos.y;pos[i*3+2]=h.pos.z;});
  dotGeo.attributes.position.needsUpdate=true;
  for(const h of planets){h.group.position.copy(h.pos);const px=screenR(h.pos,h.size);const u=h.mesh.material.uniforms;u.uPx.value=px;u.uTime.value=T;
    const g=px>70?geoHi:px>14?geoMid:geoLo;if(h.mesh.geometry!==g){h.mesh.geometry=g;h.atmo.geometry=g;}
    h.atmoMat.uniforms.uFade.value=clamp((px-3)/14,0,1);
    if(h.sats){const o=clamp((px-8)/30,0,1);h.sats.visible=o>0;h.sats.material.opacity=.95*o;h.sats.rotation.y+=h.sats.userData.spin*dt*sp;}
    h.mesh.rotation.y+=h.spin*dt*sp;}
  for(const h of asteroids){h.astRot.x+=h.astSpin*dt*.3*sp;h.astRot.y+=h.astSpin*dt*.2*sp;astDummy.position.copy(h.pos);astDummy.rotation.copy(h.astRot);astDummy.scale.copy(h.astScale);astDummy.updateMatrix();astMesh.setMatrixAt(h.idx,astDummy.matrix);}
  astMesh.instanceMatrix.needsUpdate=true;
  if(!introDone){intro.t=Math.min(1,intro.t+dt/3.2);camera.position.lerpVectors(intro.from,intro.to,ease(intro.t));controls.target.set(0,0,0);if(intro.t>=1)introDone=true;}
  if(fly.active){fly.t=Math.min(1,fly.t+dt/fly.dur);const e=ease(fly.t);const tgt=fly.targetFn();
    const endPos=fly.overview?new THREE.Vector3(0,270,620):tgt.clone().add(fly.dir.clone().multiplyScalar(fly.dist));
    controls.target.lerpVectors(fly.fromT,tgt,e);camera.position.lerpVectors(fly.from,endPos,e);
    if(fly.t>=1){fly.active=false;fly.overview=false;if(fly.follow){follow=fly.follow;lastFollow.copy(follow.pos);}}}
  else if(follow){const d=follow.pos.clone().sub(lastFollow);camera.position.add(d);controls.target.add(d);lastFollow.copy(follow.pos);}
  controls.enablePan=!follow&&!fly.active;
  controls.update();
  composer.render();
  drawOverlay();
  if(++frames===3)document.getElementById("loading").classList.add("gone");
  requestAnimationFrame(animate);
}
function drawOverlay(){
  octx.setTransform(ODPR,0,0,ODPR,0,0);octx.clearRect(0,0,OW,OH);
  octx.textAlign="left";octx.textBaseline="middle";
  const list=[];
  for(const h of planets){if(h.rank>10&&h!==selected&&h!==hovered)continue;const s=project(h.pos);if(s.z>1||s.x<-40||s.x>OW+40||s.y<-40||s.y>OH+40)continue;list.push([h,s]);}
  for(const h of [selected,hovered]){if(h&&h.cls==="asteroid"){const s=project(h.pos);if(s.z<1)list.push([h,s]);}}
  for(const[h,s] of list){
    const R=Math.max(screenR(h.pos,h.size),2.5),sel=h===selected,hov=h===hovered;
    if(sel||hov){const b=R*1.2+9,l=Math.max(5,Math.min(14,b*.4));octx.strokeStyle=sel?"#fc3d21":"rgba(255,255,255,.85)";octx.lineWidth=1.3;octx.beginPath();
      for(const[sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const cx=s.x+sx*b,cy=s.y+sy*b;octx.moveTo(cx,cy-sy*l);octx.lineTo(cx,cy);octx.lineTo(cx-sx*l,cy);}octx.stroke();}
    if(R>60&&sel)continue;
    const x0=s.x+R*.72+2,y0=s.y-R*.72-2,x1=x0+14,y1=y0-14;
    octx.strokeStyle=sel?"rgba(252,61,33,.9)":"rgba(255,255,255,.38)";octx.lineWidth=1;octx.beginPath();octx.moveTo(x0,y0);octx.lineTo(x1,y1);octx.lineTo(x1+8,y1);octx.stroke();
    octx.font="600 10.5px 'IBM Plex Mono', monospace";octx.fillStyle=sel?"#fff":"rgba(255,255,255,.82)";
    octx.fillText(h.name.toUpperCase(),x1+12,y1);
    octx.font="400 9.5px 'IBM Plex Mono', monospace";octx.fillStyle=sel?"rgba(252,61,33,.95)":"rgba(160,166,178,.75)";
    octx.fillText(`#${h.rank} · ${t("cls")[h.cls].toUpperCase()}`,x1+12,y1+13);
  }
}
