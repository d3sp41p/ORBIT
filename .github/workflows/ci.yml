name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: English only (no Cyrillic in apps, packages, supabase)
        run: pnpm check:cyrillic
      - name: Cyrillic check (spec command)
        run: |
          if grep -rnIP "[А-Яа-яЁё]" apps packages --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist; then
            echo "Cyrillic text found"; exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No secrets in the client build
        run: pnpm check:secrets
      - name: Browser tests (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
